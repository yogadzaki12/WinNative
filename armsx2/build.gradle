plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.armsx2'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters 'arm64-v8a'
        }
        buildConfigField 'boolean', 'STORAGE_ALL_FILES', 'true'
        buildConfigField 'String', 'VERSION_NAME', '"2.6.8"'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Prebuilt emucore by default; build from source with -Parmsx2.buildNative=true.
    def armsx2BuildNative = project.hasProperty('armsx2.buildNative') &&
            project.property('armsx2.buildNative').toString() == 'true'
    def emucoreOut = layout.buildDirectory.dir("generated/emucore/arm64-v8a")

    sourceSets {
        main {
            jniLibs.srcDirs += armsx2BuildNative ?
                    "${layout.buildDirectory.get().asFile}/generated/emucore" :
                    "prebuilt/emucore"
        }
    }

    if (armsx2BuildNative) {
        tasks.register('buildEmucore', Exec) {
            inputs.file("$projectDir/build-emucore.sh")
            inputs.dir("$projectDir/patches")
            outputs.dir(emucoreOut)
            doFirst { emucoreOut.get().asFile.mkdirs() }
            commandLine 'bash', "$projectDir/build-emucore.sh",
                    android.ndkDirectory.absolutePath,
                    "${android.sdkDirectory}/cmake/3.22.1/bin",
                    emucoreOut.get().asFile.absolutePath
        }
        tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'buildEmucore' }
    }
}

dependencies {
    implementation libs.coreKtx
    implementation libs.appcompat
    implementation libs.material

    implementation platform(libs.composeBom)
    implementation libs.activityCompose
    implementation libs.composeMaterial3
    implementation libs.composeUi
    implementation libs.composeUiGraphics
    implementation libs.composeFoundation
    implementation libs.composeUiToolingPreview
    implementation libs.lifecycleViewmodelCompose
    implementation libs.lifecycleRuntimeCompose

    implementation libs.kotlinReflect
    implementation libs.documentfile
    implementation libs.coilCompose
    implementation libs.coilGif
    implementation libs.composeIconsFontAwesome
    implementation libs.composeIconsLineAwesome
}
